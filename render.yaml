databases:
  - name: tplab2-db
    plan: free
    databaseName: tplab2_db
    user: tplab2_user

services:
  - type: web
    plan: free
    name: tplab2-app
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn tplab2.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tplab2-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4